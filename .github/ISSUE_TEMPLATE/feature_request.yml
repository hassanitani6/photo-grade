name: Feature request
description: Suggest a new setting, preset or option.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What kind of photos is it for?
    validations:
      required: true
